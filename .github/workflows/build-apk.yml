name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare embedded book
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          BOOK="$(find . -maxdepth 1 -type f -iname '*.pdf' -print -quit)"
          if [ -z "$BOOK" ]; then
            echo "No PDF found in repository root."
            exit 1
          fi
          cp "$BOOK" app/src/main/assets/book.pdf
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: riyada-lisan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
